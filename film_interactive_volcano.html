<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火山測驗：探索地球的生命推手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fef2f2; }
        .volcano-bg { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); }
        .option-btn:hover { transform: translateY(-2px); transition: all 0.2s; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div id="app" class="max-w-2xl mx-auto">
        <!-- Header -->
        <header class="volcano-bg text-white rounded-2xl p-6 mb-8 shadow-xl text-center">
            <h1 class="text-3xl font-bold mb-2"><i class="fas fa-volcano mr-2"></i> 火山的奧秘</h1>
            <p class="opacity-90">探索火山如何創造大氣、水與陸地</p>
        </header>

        <!-- Quiz Container -->
        <div id="quiz-container" class="glass-card rounded-2xl shadow-lg p-8 border border-red-100">
            <!-- Progress Bar -->
            <div class="mb-6">
                <div class="flex justify-between text-sm text-red-600 mb-2 font-bold">
                    <span id="question-index">問題 1 / 10</span>
                    <span id="score-display">得分: 0</span>
                </div>
                <div class="w-full bg-red-100 rounded-full h-2">
                    <div id="progress-bar" class="bg-red-500 h-2 rounded-full transition-all duration-500" style="width: 10%"></div>
                </div>
            </div>

            <!-- Question Area -->
            <div id="question-view">
                <div class="flex justify-between items-start mb-6">
                    <h2 id="question-text" class="text-xl font-bold text-gray-800 leading-relaxed">正在加載題目...</h2>
                    <button onclick="speakQuestion()" class="ml-4 p-2 bg-red-100 text-red-600 rounded-full hover:bg-red-200 transition-colors" title="播放語音">
                        <i class="fas fa-volume-up"></i>
                    </button>
                </div>

                <div id="options-grid" class="grid gap-4 mb-8">
                    <!-- Options injected here -->
                </div>

                <!-- Explanation Area (Hidden initially) -->
                <div id="feedback" class="hidden rounded-xl p-4 mb-6">
                    <p id="feedback-text" class="font-bold mb-2"></p>
                    <p id="rationale-text" class="text-sm opacity-90"></p>
                </div>

                <button id="next-btn" class="hidden w-full py-4 bg-gray-800 text-white font-bold rounded-xl hover:bg-gray-700 transition-all shadow-lg">
                    下一題 <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>

            <!-- Results Area (Hidden initially) -->
            <div id="result-view" class="hidden text-center py-8">
                <div class="text-6xl mb-4 text-red-500"><i class="fas fa-trophy"></i></div>
                <h2 class="text-3xl font-bold mb-2">測驗完成！</h2>
                <p id="final-score" class="text-xl text-gray-600 mb-8 font-bold"></p>
                <button onclick="location.reload()" class="px-8 py-3 bg-red-500 text-white rounded-full font-bold shadow-lg hover:bg-red-600 transition-all">
                    再試一次
                </button>
            </div>
        </div>
    </div>

    <script>
        const quizData = {
            "questions": [
                {
                    "question": "根據地球演化史，火山噴發釋放的氣體對早期地球最主要的貢獻是什麼？",
                    "options": [
                        { "text": "形成原始大氣層", "isCorrect": true, "rationale": "透過排氣作用，火山釋放二氧化碳、水蒸氣與氮氣，建立了原始大氣。" },
                        { "text": "產生臭氧層", "isCorrect": false, "rationale": "臭氧層是後來氧氣經太陽照射形成的。" },
                        { "text": "降低地球表面溫度", "isCorrect": false, "rationale": "初期火山氣體其實具有溫室效應。" },
                        { "text": "直接生成高濃度氧氣", "isCorrect": false, "rationale": "火山氣體不含氧氣。" }
                    ]
                },
                {
                    "question": "地球上廣闊的海洋與火山活動有何直接關聯？",
                    "options": [
                        { "text": "水蒸氣冷凝形成降雨", "isCorrect": true, "rationale": "火山噴出的水蒸氣在大氣中冷凝，降雨填滿了地表形成海洋。" },
                        { "text": "海底火山噴發液態水", "isCorrect": false, "rationale": "火山噴出的是高溫岩漿與氣體。" },
                        { "text": "岩漿冷卻後轉化為水", "isCorrect": false, "rationale": "火成岩無法直接轉化為水。" },
                        { "text": "火山活動吸引了彗星撞擊", "isCorrect": false, "rationale": "火山釋放水蒸氣是主要地球自產水源。" }
                    ]
                },
                {
                    "question": "為什麼火山地區的土壤通常非常肥沃，適合農業發展？",
                    "options": [
                        { "text": "富含磷、鉀等礦物質", "isCorrect": true, "rationale": "火山灰與熔岩風化後釋放豐富礦物質，形成極其肥沃的土壤。" },
                        { "text": "岩漿提供了生長所需熱量", "isCorrect": false, "rationale": "過高溫度會殺死生命。" },
                        { "text": "火山灰能阻擋害蟲侵擾", "isCorrect": false, "rationale": "火山灰過多會覆蓋植物。" },
                        { "text": "火山氣體有助於固氮", "isCorrect": false, "rationale": "固氮是微生物作用。" }
                    ]
                },
                {
                    "question": "火山在創造「新陸地」的過程中扮演什麼角色？",
                    "options": [
                        { "text": "堆積熔岩形成島嶼", "isCorrect": true, "rationale": "如夏威夷、冰島，皆是海底火山堆疊出的新陸地。" },
                        { "text": "將海底泥沙推向岸邊", "isCorrect": false, "rationale": "這是洋流作用。" },
                        { "text": "降低海平面露出陸地", "isCorrect": false, "rationale": "火山局部增加地殼物質。" },
                        { "text": "壓縮空氣形成浮島", "isCorrect": false, "rationale": "島嶼是固體地殼。" }
                    ]
                },
                {
                    "question": "火山活動如何幫助地球進行「溫度調節」？",
                    "options": [
                        { "text": "釋放內部熱量防止過熱", "isCorrect": true, "rationale": "火山如同安全閥，將核心能量釋放到表面，防止內部過熱。" },
                        { "text": "吸收陽光降低大氣熱量", "isCorrect": false, "rationale": "長期調節主要靠碳循環。" },
                        { "text": "冷卻極地冰帽", "isCorrect": false, "rationale": "火山噴發帶有高溫。" },
                        { "text": "中和酸雨產生的熱能", "isCorrect": false, "rationale": "酸雨是負面影響。" }
                    ]
                },
                {
                    "question": "下列哪種「清潔能源」是利用火山地區的地下熱能產生的？",
                    "options": [
                        { "text": "地熱能", "isCorrect": true, "rationale": "岩漿庫加熱地下水，蒸氣可驅動渦輪發電。" },
                        { "text": "太陽能", "isCorrect": false, "rationale": "來自太陽光輻射。" },
                        { "text": "潮汐能", "isCorrect": false, "rationale": "來自引力作用。" },
                        { "text": "生質能", "isCorrect": false, "rationale": "來自有機物。" }
                    ]
                },
                {
                    "question": "火山活動與珍貴礦產（如金、銀、鑽石）的形成有何關聯？",
                    "options": [
                        { "text": "提供極端的高壓與高溫", "isCorrect": true, "rationale": "鑽石在深處高壓形成，隨火山帶往地表。" },
                        { "text": "火山灰在高空冷卻變形", "isCorrect": false, "rationale": "寶石形成於地底深處。" },
                        { "text": "岩漿與海水化學反應", "isCorrect": false, "rationale": "核心機制是地球內部的溫壓。" },
                        { "text": "火山口直接捕捉隕石", "isCorrect": false, "rationale": "礦物來自地球內部。" }
                    ]
                },
                {
                    "question": "火山在「碳循環」中扮演的關鍵角色是什麼？",
                    "options": [
                        { "text": "將碳從地殼回收到大氣", "isCorrect": true, "rationale": "將地底或沉積物中的碳以CO2形式噴出，維持平衡。" },
                        { "text": "直接吸收大氣二氧化碳", "isCorrect": false, "rationale": "火山是釋放源。" },
                        { "text": "將二氧化碳轉化為氧氣", "isCorrect": false, "rationale": "這是植物功能。" },
                        { "text": "固化碳元素形成煤炭", "isCorrect": false, "rationale": "煤炭由古代植物形成。" }
                    ]
                },
                {
                    "question": "深海熱液噴口（海底火山）對生物學研究有何重大意義？",
                    "options": [
                        { "text": "可能是地球生命的起源地", "isCorrect": true, "rationale": "那裡的極端環境提供了早期化學演化所需的能量。" },
                        { "text": "是深海唯一的氧氣來源", "isCorrect": false, "rationale": "海底噴口釋放的是化學物質。" },
                        { "text": "阻止了海洋生物的演化", "isCorrect": false, "rationale": "它促成了特殊生態系演化。" },
                        { "text": "將海洋生物傳送到地底", "isCorrect": false, "rationale": "噴口是物質輸出的出口。" }
                    ]
                },
                {
                    "question": "如果地球上的所有火山活動永久停止，長期來看最可能的後果是？",
                    "options": [
                        { "text": "地球逐漸冷卻並失去大氣", "isCorrect": true, "rationale": "地核冷卻導致磁場消失，大氣將被剝離。" },
                        { "text": "地球將永遠保持和平穩定", "isCorrect": false, "rationale": "停止意味著地球地質活動死亡。" },
                        { "text": "大氣層會變得更厚更安全", "isCorrect": false, "rationale": "大氣會逐漸變薄。" },
                        { "text": "海水量會不斷增加", "isCorrect": false, "rationale": "磁場消失可能導致水散失。" }
                    ]
                }
            ]
        };

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function initQuiz() {
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            const q = quizData.questions[currentIdx];
            document.getElementById('question-index').textContent = `問題 ${currentIdx + 1} / 10`;
            document.getElementById('question-text').textContent = q.question;
            document.getElementById('score-display').textContent = `得分: ${score}`;
            document.getElementById('progress-bar').style.width = `${(currentIdx + 1) * 10}%`;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 text-left border-2 border-red-100 rounded-xl hover:bg-red-50 hover:border-red-300 transition-all flex justify-between items-center bg-white";
                btn.innerHTML = `<span>${opt.text}</span><i class="far fa-circle text-gray-300"></i>`;
                btn.onclick = () => selectOption(i, btn);
                grid.appendChild(btn);
            });

            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(idx, btn) {
            if(answered) return;
            answered = true;
            
            const q = quizData.questions[currentIdx];
            const opt = q.options[idx];
            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedback-text');
            const rationaleText = document.getElementById('rationale-text');

            if(opt.isCorrect) {
                score += 10;
                btn.classList.add('bg-green-50', 'border-green-500', 'text-green-700');
                btn.querySelector('i').className = 'fas fa-check-circle text-green-500';
                feedback.className = 'rounded-xl p-4 mb-6 bg-green-100 text-green-800 block';
                feedbackText.textContent = "回答正確！🎉";
            } else {
                btn.classList.add('bg-red-50', 'border-red-500', 'text-red-700');
                btn.querySelector('i').className = 'fas fa-times-circle text-red-500';
                feedback.className = 'rounded-xl p-4 mb-6 bg-red-100 text-red-800 block';
                feedbackText.textContent = "再接再厲！";
                
                // Show correct answer
                Array.from(document.querySelectorAll('.option-btn')).forEach((b, i) => {
                    if(q.options[i].isCorrect) {
                        b.classList.add('border-green-500');
                    }
                });
            }

            rationaleText.textContent = opt.rationale;
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('score-display').textContent = `得分: ${score}`;
        }

        document.getElementById('next-btn').onclick = () => {
            currentIdx++;
            if(currentIdx < quizData.questions.length) {
                showQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('final-score').textContent = `你的總得分是：${score} / 100`;
        }

        function speakQuestion() {
            const q = quizData.questions[currentIdx].question;
            const msg = new SpeechSynthesisUtterance(q);
            msg.lang = 'zh-TW';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
        }

        initQuiz();
    </script>
</body>
</html>
